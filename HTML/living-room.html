<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ega Furniture</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/shared.css" />
    <link rel="stylesheet" href="../CSS/living-room.css" />
  </head>
  <body>
    <!-- Header -->
    <header></header>

    <div class="main-container">
      <div class="bread-crumb">
        <a href="../HTML/home.html">Trang chủ</a> /
        <span>Phòng khách</span>
      </div>
      <div class="title-filter">
        <h2>Phòng khách</h2>
        <div class="filter-container">
          <div class="filter-item">
            <label for="sort">Sắp xếp:</label>
            <select id="sort" class="form-select">
              <option value="name-az">Tên A->Z</option>
              <option value="name-za">Tên Z->A</option>
              <option value="price-asc">Giá tăng dần</option>
              <option value="price-desc">Giá giảm dần</option>
              <option value="newest">Mới nhất</option>
            </select>
          </div>
        </div>
      </div>
      <div class="content-container">
        <button class="filter-toggle-btn d-md-none" onclick="toggleFilter()">
          <i class="fa fa-filter"></i> Lọc
        </button>
        <div class="filter-detail-container d-none d-md-flex">
          <div class="filter-detail">
            <div class="price-select select-detail">
              <p>MỨC GIÁ</p>
              <ul class="price-filter filter-list">
                <li>
                  <input type="checkbox" id="price1" />
                  <label for="price1">Giá dưới 1.000.000đ</label>
                </li>
                <li>
                  <input type="checkbox" id="price2" />
                  <label for="price2">1.000.000đ - 2.000.000đ</label>
                </li>
                <li>
                  <input type="checkbox" id="price3" />
                  <label for="price3">2.000.000đ - 3.000.000đ</label>
                </li>
                <li>
                  <input type="checkbox" id="price4" />
                  <label for="price4">3.000.000đ - 5.000.000đ</label>
                </li>
                <li>
                  <input type="checkbox" id="price5" />
                  <label for="price5">5.000.000đ - 7.000.000đ</label>
                </li>
                <li>
                  <input type="checkbox" id="price6" />
                  <label for="price6">7.000.000đ - 10.000.000đ</label>
                </li>
                <li>
                  <input type="checkbox" id="price7" />
                  <label for="price7">Giá trên 10.000.000đ</label>
                </li>
              </ul>
            </div>
            <div class="delivery-service select-detail">
              <p>DỊCH VỤ GIAO HÀNG</p>
              <ul class="delivery-filter filter-list">
                <li>
                  <input type="checkbox" id="delivery1" />
                  <label for="delivery1">Miễn phí giao hàng</label>
                </li>
                <li>
                  <input type="checkbox" id="delivery2" />
                  <label for="delivery2">Giao hàng nhanh 4h</label>
                </li>
                <li>
                  <input type="checkbox" id="delivery3" />
                  <label for="delivery3">Giao hàng tiết kiệm</label>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="product-card-group"></div>
      </div>
    </div>

    <!-- modal -->
    <div class="modal-group-container"></div>

    <!-- Footer -->
    <footer></footer>

    <script src="../SCRIPT/living-room.js"></script>
    <script src="../SCRIPT/room.js"></script>
    <script src="../SCRIPT/shared.js"></script>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </body>
</html>
