<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch sử mua hàng | EGA Furniture</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/shared.css" />
  <link rel="stylesheet" href="../CSS/cart.css" />
  <style>
    .history-page { max-width: 1100px; margin: 0 auto; padding: 34px 24px 60px; }
    .history-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    .history-heading h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.3rem); }
    .history-empty { text-align: center; background: #fff; border: 1px solid #f0e4dc; border-radius: 14px; padding: 60px 20px; }
    .history-empty i { color: #ff7a1f; font-size: 3rem; }
    .order-card { background: #fff; border: 1px solid #f0e4dc; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
    .order-top { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid #f0e4dc; }
    .order-id { font-weight: 700; color: #222; }
    .order-date { color: #777; font-size: .9rem; }
    .order-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #f5efe9; }
    .order-item:last-child { border-bottom: 0; }
    .order-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
    .order-item-info { flex: 1; }
    .order-item-title { font-weight: 600; color: #333; }
    .order-item-meta { color: #777; font-size: .9rem; margin-top: 4px; }
    .order-total { display: flex; justify-content: flex-end; gap: 12px; padding-top: 14px; font-size: 1.1rem; }
    .order-total strong { color: #ff5a00; }
    @media (max-width: 576px) {
      .history-page { padding: 24px 14px 40px; }
      .history-heading, .order-top { align-items: flex-start; flex-direction: column; }
      .order-item { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header></header>
  <main class="history-page">
    <div class="bread-crumb mb-3"><a href="../HTML/home.html">Trang chủ</a> / <span>Lịch sử mua hàng</span></div>
    <div class="history-heading">
      <div>
        <h1>Lịch sử mua hàng</h1>
        <p class="text-muted mb-0">Theo dõi những sản phẩm bạn đã thanh toán.</p>
      </div>
      <button id="clearHistoryBtn" class="btn btn-outline-danger"><i class="bi bi-trash3 me-1"></i>Xóa lịch sử</button>
    </div>
    <div id="purchaseHistory"></div>
  </main>
  <footer></footer>
  <script src="../SCRIPT/shared.js"></script>
  <script>
    function formatHistoryCurrency(amount) {
      return new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND", maximumFractionDigits: 0 }).format(amount);
    }

    function renderPurchaseHistory() {
      const container = document.getElementById("purchaseHistory");
      const orders = JSON.parse(localStorage.getItem("egaPurchaseHistory") || "[]");
      const clearButton = document.getElementById("clearHistoryBtn");
      clearButton.style.display = orders.length ? "inline-block" : "none";

      if (!orders.length) {
        container.innerHTML = `
          <div class="history-empty">
            <i class="bi bi-receipt"></i>
            <h3 class="mt-3">Chưa có đơn hàng nào</h3>
            <p class="text-muted">Các đơn hàng sau khi thanh toán sẽ được lưu tại đây.</p>
            <a href="../HTML/home.html" class="btn btn-primary">Bắt đầu mua sắm</a>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map((order) => `
        <article class="order-card">
          <div class="order-top">
            <div>
              <div class="order-id">Mã đơn: ${order.id}</div>
              <div class="order-date">${new Date(order.createdAt).toLocaleString("vi-VN")}</div>
              <div class="order-date">Thanh toán: ${order.paymentMethod || "Chưa cập nhật"}</div>
              ${order.cashReceived ? `<div class="order-date">Tiền khách đưa: ${formatHistoryCurrency(order.cashReceived)} | Thối lại: ${formatHistoryCurrency(order.changeAmount || 0)}</div>` : ""}
            </div>
            <span class="badge text-bg-success">Đã thanh toán</span>
          </div>
          <div>
            ${(order.items || []).map((item) => `
              <div class="order-item">
                <img src="${item.img}" alt="${item.title}" />
                <div class="order-item-info">
                  <div class="order-item-title">${item.title}</div>
                  <div class="order-item-meta">Số lượng: ${item.quantity || 1} x ${formatHistoryCurrency(item.price || 0)}</div>
                </div>
                <strong>${formatHistoryCurrency((item.price || 0) * (item.quantity || 1))}</strong>
              </div>
            `).join("")}
          </div>
          <div class="order-total"><span>Tổng cộng:</span> <strong>${formatHistoryCurrency(order.total || 0)}</strong></div>
        </article>
      `).join("");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser") || "null");
      if (!loggedInUser) {
        window.location.href = "../HTML/dangnhap.html";
        return;
      }

      renderPurchaseHistory();
      document.getElementById("clearHistoryBtn").addEventListener("click", () => {
        if (confirm("Bạn có chắc muốn xóa toàn bộ lịch sử mua hàng không?")) {
          localStorage.removeItem("egaPurchaseHistory");
          renderPurchaseHistory();
        }
      });
    });
  </script>
</body>
</html>
