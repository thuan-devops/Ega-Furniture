<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ega Furniture</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/shared.css" />
  <link rel="stylesheet" href="../CSS/dangnhap-dangky.css" />
</head>

<body>
  <!-- Header -->
  <header></header>

  <div class="main-container"></div>
  <div class="bread-crumb">
    <a href="../HTML/home.html">Trang chủ</a> /
    <span>Đăng ký tài khoản</span>
  </div>
  <div class="content-container">
    <div class="login-title w-100 d-flex justify-content-center align-items-center flex-column">
      <h2 style="font-size: 25px">ĐĂNG KÝ TÀI KHOẢN</h2>
      <p>
        Bạn đã có tài khoản ? Đăng nhập
        <span><a href="../HTML/dangnhap.html" style="color: var(--orange)">tại đây</a></span>
      </p>
    </div>
    <div class="form-group-container w-100 d-flex justify-content-center align-items-center flex-column">
      <div class="form-input-group">
        <div class="form-line">
          <label for="hoTen" class="form-label">Họ và Tên <span style="color: red">*</span></label>
          <input type="text" class="form-control" id="hoTen" name="hoTen" placeholder="Nhập họ và tên của bạn"
            required />
          <span id="hoTen-error" class="error-message text-danger"></span>
        </div>
        <div class="form-line">
          <label for="ngaySinh" class="form-label">Ngày sinh <span style="color: red">*</span></label>
          <input type="date" class="form-control" id="ngaySinh" name="ngaySinh" required />
          <span id="ngaySinh-error" class="error-message text-danger"></span>
        </div>
        <div class="form-line">
          <label for="gioiTinh" class="form-label">Giới tính <span style="color: red">*</span></label>
          <select class="form-control" id="gioiTinh" name="gioiTinh" required>
            <option value="">Chọn giới tính</option>
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
            <option value="Khác">Khác</option>
          </select>
          <span id="gioiTinh-error" class="error-message text-danger"></span>
        </div>
        <div class="form-line">
          <label for="password" class="form-label">Mật khẩu <span style="color: red">*</span></label>
          <div class="password-container">
            <input type="password" class="form-control" id="password" name="password"
              placeholder="Nhập mật khẩu của bạn" required />
            <span id="password-error" class="error-message text-danger"></span>
            <i class="fa fa-eye toggle-password" id="togglePassword"></i>
          </div>
        </div>
        <div class="form-line">
          <label for="confirmPassword" class="form-label">Nhập lại mật khẩu <span style="color: red">*</span></label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
            placeholder="Nhập lại mật khẩu của bạn" required />
          <span id="confirmPassword-error" class="error-message text-danger"></span>
        </div>
        <button type="submit" class="btn w-100">Đăng ký</button>
      </div>
      <div class="external-group mt-4">
        <p class="text-center">Hoặc đăng nhập bằng</p>
        <div class="d-flex justify-content-center">
          <button class="btn btn-primary me-2 d-flex align-items-center">
            <i class="fa fa-facebook-official me-2"></i> Facebook
          </button>
          <button class="btn btn-danger d-flex align-items-center">
            <i class="fa fa-google-plus me-2"></i> Google
          </button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <!-- Footer -->
  <footer></footer>

  <script src="../SCRIPT/shared.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  <script>
    $(document).ready(function () {
      // Xử lý nút hiện/ẩn mật khẩu
      $("#togglePassword").on("click", function () {
        const passwordInput = $("#password");
        const type =
          passwordInput.attr("type") === "password" ? "text" : "password";
        passwordInput.attr("type", type);
        $(this).toggleClass("fa-eye fa-eye-slash");
      });

      // Kiểm tra trường mật khẩu khi mất focus
      $("#password").on("blur", function () {
        const password = $(this).val().trim();
        if (password === "") {
          showError("#password", "Mật khẩu không được để trống");
          $("#togglePassword").hide(); // Ẩn nút hiện mật khẩu khi có lỗi
        } else if (password.length < 6) {
          showError("#password", "Mật khẩu phải có ít nhất 6 ký tự");
          $("#togglePassword").hide();
        } else {
          removeError("#password");
          $("#togglePassword").show(); // Hiển thị lại nút nếu không có lỗi
        }
      });

      // Hiển thị lại nút hiện mật khẩu khi focus vào trường mật khẩu
      $("#password").on("focus", function () {
        $("#togglePassword").show(); // Hiển thị lại nút hiện mật khẩu
        removeError("#password"); // Xóa lỗi nếu có
      });

      // Kiểm tra từng trường khi mất focus
      $("#hoTen").on("blur", function () {
        const hoTen = $(this).val().trim();
        if (hoTen === "") {
          showError("#hoTen", "Họ và Tên không được để trống");
        } else {
          removeError("#hoTen");
        }
      });

      $("#ngaySinh").on("blur", function () {
        const ngaySinh = $(this).val();
        if (ngaySinh === "") {
          showError("#ngaySinh", "Ngày sinh không được để trống");
        } else {
          removeError("#ngaySinh");
        }
      });

      $("#gioiTinh").on("blur", function () {
        const gioiTinh = $(this).val();
        if (gioiTinh === "") {
          showError("#gioiTinh", "Vui lòng chọn giới tính");
        } else {
          removeError("#gioiTinh");
        }
      });

      $("#confirmPassword").on("blur", function () {
        const password = $("#password").val().trim();
        const confirmPassword = $(this).val().trim();
        if (confirmPassword === "") {
          showError(
            "#confirmPassword",
            "Nhập lại mật khẩu không được để trống"
          );
        } else if (confirmPassword !== password) {
          showError("#confirmPassword", "Mật khẩu không khớp");
        } else {
          removeError("#confirmPassword");
        }
      });

      // Xóa lỗi khi người dùng focus vào các trường khác
      $("#hoTen, #ngaySinh, #gioiTinh, #confirmPassword").on(
        "focus",
        function () {
          removeError(`#${$(this).attr("id")}`);
        }
      );

      // Hiển thị lỗi
      function showError(id, message) {
        $(`${id}`).addClass("is-invalid");
        $(`${id}-error`).text(message);
      }

      // Xóa lỗi
      function removeError(id) {
        $(`${id}`).removeClass("is-invalid");
        $(`${id}-error`).text("");
      }
    });
  </script>
</body>

</html>
