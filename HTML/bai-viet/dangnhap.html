<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ega Furniture</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/shared.css" />
  <link rel="stylesheet" href="../CSS/dangnhap-dangky.css" />
</head>

<body>
  <!-- Header -->
  <header></header>

  <div class="main-container">
    <div class="bread-crumb">
      <a href="../HTML/home.html">Trang chủ</a> /
      <span>Đăng nhập tài khoản</span>
    </div>
    <div class="content-container">
      <div class="login-title w-100 d-flex justify-content-center align-items-center flex-column">
        <h2 style="font-size: 25px">ĐĂNG NHẬP TÀI KHOẢN</h2>
        <p>
          Bạn chưa có tài khoản ?
          <span><a href="../HTML/dangky.html" style="color: var(--orange)">Đăng ký tại đây</a></span>
        </p>
      </div>
      <div class="form-group-container w-100 d-flex justify-content-center align-items-center flex-column">
        <div class="form-input-group">
          <div class="form-line">
            <label for="email" class="form-label">Email <span style="color: red">*</span></label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Nhập email của bạn"
              required />
            <span id="email-error" class="error-message text-danger"></span>
          </div>
          <div class="form-line">
            <label for="password" class="form-label">Mật khẩu <span style="color: red">*</span></label>
            <input type="password" class="form-control" id="password" name="password"
              placeholder="Nhập mật khẩu của bạn" required />
            <span id="password-error" class="error-message text-danger"></span>
          </div>
          <button type="submit" class="btn w-100">Đăng nhập</button>
        </div>
        <div class="external-group mt-4">
          <p class="text-center">Hoặc đăng nhập bằng</p>
          <div class="d-flex justify-content-center">
            <button class="btn btn-primary me-2 d-flex align-items-center">
              <i class="fa fa-facebook-official me-2"></i> Facebook
            </button>
            <button class="btn btn-danger d-flex align-items-center">
              <i class="fa fa-google-plus me-2"></i> Google
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer></footer>

  <script src="../SCRIPT/shared.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  <script>
    $(document).ready(function () {
      function validateEmail() {
        const email = $("#email").val().trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email === "") {
          showError("email", "Email không được để trống");
          return false;
        } else if (!emailRegex.test(email)) {
          showError("email", "Email không hợp lệ");
          return false;
        } else {
          removeError("email");
          return true;
        }
      }

      function validatePassword() {
        const password = $("#password").val().trim();

        if (password === "") {
          showError("password", "Mật khẩu không được để trống");
          return false;
        } else if (password.length < 6) {
          showError("password", "Mật khẩu phải có ít nhất 6 ký tự");
          return false;
        } else {
          removeError("password");
          return true;
        }
      }

      // Xử lý blur
      $("#email").on("blur", validateEmail);
      $("#password").on("blur", validatePassword);

      // Xóa lỗi khi focus
      $("#email, #password").on("focus", function () {
        removeError(this.id);
      });

      // Xử lý nút Đăng nhập
      $('.btn[type="submit"]').on("click", function (e) {
        e.preventDefault();

        const isEmailValid = validateEmail();
        const isPasswordValid = validatePassword();

        if (isEmailValid && isPasswordValid) {
          alert("Đăng nhập thành công!");
        } else {
          alert("Vui lòng kiểm tra lại thông tin đăng nhập");
        }
      });

      // Hiển thị lỗi
      function showError(id, message) {
        $(`#${id}`).addClass("is-invalid");
        $(`#${id}-error`).text(message);
      }

      // Xóa lỗi
      function removeError(id) {
        $(`#${id}`).removeClass("is-invalid");
        $(`#${id}-error`).text("");
      }
    });

  </script>
</body>

</html>
