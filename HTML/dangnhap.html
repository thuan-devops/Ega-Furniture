<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ega Furniture</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/shared.css" />
  <link rel="stylesheet" href="../CSS/dangnhap-dangky.css" />
</head>

<body>
  <!-- Header -->
  <header></header>

  <div class="main-container">
    <div class="bread-crumb">
      <a href="../HTML/home.html">Trang chủ</a> /
      <span>Đăng nhập tài khoản</span>
    </div>
    <div class="content-container">
      <div class="login-title w-100 d-flex justify-content-center align-items-center flex-column">
        <h2 style="font-size: 25px">ĐĂNG NHẬP TÀI KHOẢN</h2>
        <p>
          Bạn chưa có tài khoản ?
          <span><a href="../HTML/dangky.html" style="color: var(--orange)">Đăng ký tại đây</a></span>
        </p>
      </div>
      <div class="form-group-container w-100 d-flex justify-content-center align-items-center flex-column">
        <div class="form-input-group">
          <div class="form-line">
            <label for="hoTen" class="form-label">Họ và tên <span style="color: red">*</span></label>
            <input type="text" class="form-control" id="hoTen" name="hoTen" placeholder="Nhập họ và tên của bạn"
              required />
            <span id="hoTen-error" class="error-message text-danger"></span>
          </div>
          <div class="form-line">
            <label for="password" class="form-label">Mật khẩu <span style="color: red">*</span></label>
            <input type="password" class="form-control" id="password" name="password"
              placeholder="Nhập mật khẩu của bạn" required />
            <span id="password-error" class="error-message text-danger"></span>
          </div>
          <button type="submit" class="btn w-100">Đăng nhập</button>
        </div>
        <div class="external-group mt-4">
          <p class="text-center">Hoặc đăng nhập bằng</p>
          <div class="d-flex justify-content-center">
            <button type="button" class="btn btn-primary me-2 d-flex align-items-center social-btn" data-provider="Facebook">
              <i class="fa fa-facebook-official me-2"></i> Facebook
            </button>
            <button type="button" class="btn btn-danger d-flex align-items-center social-btn" data-provider="Google">
              <i class="fa fa-google-plus me-2"></i> Google
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer></footer>

  <script src="../SCRIPT/shared.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  <script>
    $(document).ready(function () {
      function validateHoTen() {
        const hoTen = $("#hoTen").val().trim();

        if (hoTen === "") {
          showError("hoTen", "Họ và tên không được để trống");
          return false;
        }

        removeError("hoTen");
        return true;
      }

      function validatePassword() {
        const password = $("#password").val().trim();

        if (password === "") {
          showError("password", "Mật khẩu không được để trống");
          return false;
        } else if (password.length < 6) {
          showError("password", "Mật khẩu phải có ít nhất 6 ký tự");
          return false;
        } else {
          removeError("password");
          return true;
        }
      }

      $("#hoTen").on("blur", validateHoTen);
      $("#password").on("blur", validatePassword);

      $("#hoTen, #password").on("focus", function () {
        removeError(this.id);
      });

      function loginWithSocial(provider) {
        const email = prompt(`Nhập email ${provider}:`);
        if (!email) return;

        const password = prompt(`Nhập mật khẩu ${provider}:`);
        if (!password) return;

        const users = JSON.parse(localStorage.getItem("egaUsers") || "[]");
        const socialUser = {
          hoTen: `${provider} User`,
          email,
          password,
          provider,
          createdAt: new Date().toISOString()
        };

        const existingUser = users.find(
          (user) => user.email && user.email.toLowerCase() === email.toLowerCase()
        );

        if (existingUser) {
          existingUser.password = password;
          existingUser.provider = provider;
          localStorage.setItem("loggedInUser", JSON.stringify(existingUser));
          alert(`Đăng nhập bằng ${provider} thành công!`);
          window.location.href = "../HTML/home.html";
          return;
        }

        users.push(socialUser);
        localStorage.setItem("egaUsers", JSON.stringify(users));
        localStorage.setItem("loggedInUser", JSON.stringify(socialUser));
        alert(`Đăng nhập bằng ${provider} thành công!`);
        window.location.href = "../HTML/home.html";
      }

      $('.btn[type="submit"]').on("click", function (e) {
        e.preventDefault();

        const isHoTenValid = validateHoTen();
        const isPasswordValid = validatePassword();

        if (!isHoTenValid || !isPasswordValid) {
          alert("Vui lòng kiểm tra lại thông tin đăng nhập");
          return;
        }

        const hoTen = $("#hoTen").val().trim();
        const password = $("#password").val();
        const users = JSON.parse(localStorage.getItem("egaUsers") || "[]");
        const foundUser = users.find(
          (user) =>
            user.hoTen &&
            user.hoTen.trim().toLowerCase() === hoTen.toLowerCase()
        );

        if (!foundUser) {
          showError("hoTen", "Họ và tên này chưa được đăng ký");
          alert("Họ và tên chưa được đăng ký");
          return;
        }

        if (foundUser.password !== password) {
          showError("password", "Mật khẩu không đúng");
          alert("Mật khẩu không đúng");
          return;
        }

        localStorage.setItem("loggedInUser", JSON.stringify(foundUser));
        alert("Đăng nhập thành công!");
        window.location.href = "../HTML/home.html";
      });

      $(".social-btn").on("click", function () {
        const provider = $(this).data("provider");
        loginWithSocial(provider);
      });

      function showError(id, message) {
        $(`#${id}`).addClass("is-invalid");
        $(`#${id}-error`).text(message);
      }

      function removeError(id) {
        $(`#${id}`).removeClass("is-invalid");
        $(`#${id}-error`).text("");
      }
    });
  </script>
</body>

</html>
