<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm khuyến mãi</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/shared.css" />
    <link rel="stylesheet" href="../CSS/khuyenmai.css" />
    <script src="../SCRIPT/khuyenmai.js"></script>
    <script src="../SCRIPT/room.js"></script>
    <script src="../SCRIPT/shared.js"></script>
  </head>

  <body>
    <header></header>
    <div id="main">
      <div class="promo-item1">
        <img src="../IMAGE/khuyenmai/banner.png" alt="" />
      </div>
      <div class="promo-timer">
        Kết thúc sau <br />
        <span id="countdown"></span>
      </div>
      <div class="promo">
        <div class="promo-item" onclick="showDiscountProducts('EGGFREESHIP')">
          <h3>FREESHIP</h3>
          <p>Free shipping cho đơn hàng từ 500K</p>
          <p><strong>Mã: EGGFREESHIP</strong></p>
          <p>HSD: 30/06/2024</p>
        </div>
        <div class="promo-item" onclick="showDiscountProducts('GAM50K')">
          <h3>GIẢM 50K</h3>
          <p>Áp dụng cho đơn hàng từ 500K</p>
          <p><strong>Mã: GAM50K</strong></p>
          <p>HSD: 30/06/2024</p>
        </div>
        <div class="promo-item" onclick="showDiscountProducts('GAM30')">
          <h3>GIẢM 30%</h3>
          <p>Cho sản phẩm trong Nội thất.</p>
          <p><strong>Mã: GAM30</strong></p>
          <p>HSD: 30/06/2024</p>
        </div>
        <div class="promo-item" onclick="showDiscountProducts('GAM40')">
          <h3>GIẢM 40%</h3>
          <p>Cho sản phẩm từ 4 món trở lên.</p>
          <p><strong>Mã: GAM40</strong></p>
          <p>HSD: 30/06/2024</p>
        </div>
      </div>

      <div class="product-card-group"></div>
    </div>

    <!-- modal -->
    <div class="modal-group-container"></div>

    <footer></footer>
  </body>
</html>
